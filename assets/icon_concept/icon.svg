<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.55" stop-color="#FF8A2A"/>
      <stop offset="1" stop-color="#F2601C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE6D6"/>
    </linearGradient>
    <linearGradient id="fg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFE0CC" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="6" dy="16" result="b"/>
      <feFlood flood-color="#8A2E00" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <g filter="url(#shadow)" stroke-linejoin="round" stroke-width="26">
    <!-- small "[" (far panel) -->
    <polygon fill="url(#fg2)" stroke="url(#fg2)"
      points="250,362 400,340 400,392 300,404 300,620 400,632 400,684 250,662"/>
    <!-- large "]" (near panel) -->
    <polygon fill="url(#fg)" stroke="url(#fg)"
      points="560,262 770,226 770,798 560,762 560,702 700,724 700,300 560,322"/>
  </g>
</svg>
